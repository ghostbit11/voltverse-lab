<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VoltVerse — self-hosted cybersecurity training range">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070b16"/><stop offset="1" stop-color="#0d1426"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.1" r="0.9">
      <stop stop-color="#22d3ee" stop-opacity="0.22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>
  <!-- grid -->
  <g stroke="#22d3ee" stroke-opacity="0.06">
    <path d="M0 90 H1280 M0 180 H1280 M0 270 H1280"/>
    <path d="M160 0 V360 M320 0 V360 M480 0 V360 M640 0 V360 M800 0 V360 M960 0 V360 M1120 0 V360"/>
  </g>

  <!-- hex logo mark -->
  <g transform="translate(96,120)">
    <path d="M60 4 L112 34 V94 L60 124 L8 94 V34 Z" fill="none" stroke="url(#grad)" stroke-width="3" filter="url(#soft)" opacity="0.7"/>
    <path d="M60 4 L112 34 V94 L60 124 L8 94 V34 Z" fill="none" stroke="url(#grad)" stroke-width="3"/>
    <path d="M64 30 L44 70 H60 L54 100 L82 56 H64 Z" fill="url(#grad)"/>
  </g>

  <!-- wordmark -->
  <text x="250" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="800" fill="#f8fafc" letter-spacing="-1">Volt<tspan fill="url(#grad)">Verse</tspan></text>
  <text x="252" y="196" font-family="Consolas, monospace" font-size="22" fill="#94a3b8" letter-spacing="6">B R E A C H R · CYBER RANGE</text>
  <text x="252" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#cbd5e1">Self-hosted lab to learn web, API &amp; LLM security — hands-on.</text>

  <!-- chips -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">
    <g transform="translate(252,272)">
      <rect width="196" height="40" rx="20" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.4"/>
      <text x="24" y="26" fill="#7dd3fc">OWASP Web / API / LLM</text>
    </g>
    <g transform="translate(462,272)">
      <rect width="150" height="40" rx="20" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.4"/>
      <text x="22" y="26" fill="#a5b4fc">42 challenges</text>
    </g>
    <g transform="translate(626,272)">
      <rect width="120" height="40" rx="20" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.4"/>
      <text x="22" y="26" fill="#6ee7b7">8 apps</text>
    </g>
    <g transform="translate(760,272)">
      <rect width="176" height="40" rx="20" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.4"/>
      <text x="22" y="26" fill="#fcd34d">Docker · one command</text>
    </g>
  </g>

  <!-- right decorative terminal -->
  <g transform="translate(980,96)" opacity="0.9">
    <rect width="220" height="170" rx="12" fill="#0b1222" stroke="#1e293b"/>
    <circle cx="20" cy="22" r="5" fill="#ef4444"/><circle cx="40" cy="22" r="5" fill="#f59e0b"/><circle cx="60" cy="22" r="5" fill="#22c55e"/>
    <g font-family="Consolas, monospace" font-size="13">
      <text x="18" y="62" fill="#64748b">$ docker compose up</text>
      <text x="18" y="86" fill="#38bdf8">→ range online :8100</text>
      <text x="18" y="110" fill="#94a3b8">? capture the flag</text>
      <text x="18" y="134" fill="#34d399">VOLT{'{'}pwned{'}'} ✓</text>
      <text x="18" y="158" fill="#818cf8">rank ▲ leaderboard</text>
    </g>
  </g>
</svg>
