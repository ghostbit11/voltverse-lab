# VoltVerse — one self-contained cyber range (11 vulnerable apps + platform).
#   docker compose up -d --build   →   http://localhost:8100
services:
  store:
    build: .
    image: voltverse/store:1.0
    container_name: voltverse-store
    ports:
      - "8100:80"
    restart: unless-stopped
    volumes:
      # Persist the platform database (users, scores, settings) across rebuilds.
      # WARNING: `docker compose down -v` deletes this volume and ALL user data.
      - voltverse_data:/var/www/html/data

volumes:
  voltverse_data:
